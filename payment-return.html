<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying Payment | BookNest</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .box {
      background: white;
      padding: 35px;
      border-radius: 12px;
      text-align: center;
      width: min(90%, 400px);
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h2 {
      color: #2563eb;
    }

    p {
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2 id="heading">Verifying your payment...</h2>
    <p id="message">Please wait. Do not close this page.</p>
  </div>

  <script>
    async function verifyPayment() {

      const heading = document.getElementById("heading");
      const message = document.getElementById("message");

      // Get Cashfree order ID from the URL.
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get("order_id");

      if (!orderId) {
        heading.textContent = "Order ID missing";
        message.textContent =
          "We could not identify your payment. Please contact BookNest support.";
        return;
      }

      try {

        // Verify payment with our server.
        const response = await fetch(
          `/api/verify-order?order_id=${encodeURIComponent(orderId)}`
        );

        const data = await response.json();

        // Stop if payment is not verified.
        if (!response.ok || !data.success) {

          heading.textContent = "Payment not confirmed";

          message.textContent =
            "Your payment status is " +
            (data.status || "unknown") +
            ". Please contact BookNest support before trying again.";

          return;
        }

        // Save verified payment details.
        localStorage.setItem("verifiedOrderId", data.orderId);

        localStorage.setItem(
          "verifiedOrderAmount",
          data.amount
        );

        localStorage.setItem(
          "verifiedOrderCurrency",
          data.currency
        );

        // Get purchased books from the cart.
        const cart = JSON.parse(
          localStorage.getItem("cart") || "[]"
        );

        // Save purchased books for the thank-you page.
        localStorage.setItem(
          "purchasedBooks",
          JSON.stringify(cart)
        );

        // Clear cart after successful payment.
        localStorage.removeItem("cart");

        // Redirect to thank-you page.
        heading.textContent = "Payment Successful!";

        message.textContent =
          "Your payment has been verified. Redirecting you now...";

        setTimeout(() => {
          window.location.replace("thankyou.html");
        }, 1000);

      } catch (error) {

        console.error("Payment verification error:", error);

        heading.textContent = "Verification Error";

        message.textContent =
          "We could not verify your payment right now. Please contact BookNest support before trying another payment.";

      }
    }

    // Start payment verification.
    verifyPayment();

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout | BookNest</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- Cashfree Checkout SDK -->
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
      margin: 0;
      padding: 20px;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .container {
      background: rgba(255,255,255,0.85);
      padding: 38px 40px;
      border-radius: 22px;
      box-shadow: 0 12px 44px rgba(31,38,135,0.19);
      backdrop-filter: blur(7px);
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }

    h2 {
      margin-bottom: 25px;
      color: #130cb7;
      font-weight: 700;
      font-size: 2.1rem;
    }

    #order-total {
      font-size: 1.3rem;
      margin-bottom: 25px;
      font-weight: 600;
      color: #24386d;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #24386d;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #b8c5df;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: 2px solid #52a5e7;
      border-color: transparent;
    }

    #buyNowBtn {
      display: block;
      width: 100%;
      background: linear-gradient(90deg, #52e5e7, #130cb7);
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 1.15rem;
      border-radius: 12px;
      cursor: pointer;
      margin: 18px auto 0;
      font-weight: 600;
      transition: background 0.3s, transform 0.2s;
    }

    #buyNowBtn:disabled {
      background: #c1c4cb;
      cursor: not-allowed;
      color: #666;
    }

    #buyNowBtn:hover:enabled {
      background: linear-gradient(90deg, #130cb7, #52e5e7);
      transform: scale(1.03);
    }

    #confirmationModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.35);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #modalContent {
      background: #fff;
      padding: 32px 26px;
      border-radius: 14px;
      max-width: 330px;
      width: 88%;
      text-align: center;
      box-shadow: 0 4px 22px rgba(30,38,135,0.17);
    }

    #modalDesc {
      margin-bottom: 24px;
      font-size: 1.09rem;
      color: #333;
    }

    #modalContent button {
      margin: 5px;
      padding: 11px 16px;
      font-size: 1rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #modalContent button.confirm {
      background: #28a745;
      color: #fff;
    }

    #modalContent button.cancel {
      background: #fa5252;
      color: #fff;
    }

    #paymentMessage {
      margin-top: 15px;
      color: #b00020;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 22px;
        border-radius: 14px;
      }

      h2 {
        font-size: 1.6rem;
      }

      #buyNowBtn {
        padding: 13px;
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Checkout</h2>

    <p id="order-total">Loading total...</p>

    <div class="form-group">
      <label for="customerName">Full Name</label>
      <input
        type="text"
        id="customerName"
        placeholder="Enter your name"
        required
      />
    </div>

    <div class="form-group">
      <label for="customerEmail">Email Address</label>
      <input
        type="email"
        id="customerEmail"
        placeholder="Enter your email"
      />
    </div>

    <div class="form-group">
      <label for="customerPhone">Phone Number</label>
      <input
        type="tel"
        id="customerPhone"
        placeholder="Enter 10-digit phone number"
        maxlength="10"
        required
      />
    </div>

    <button id="buyNowBtn">Buy Now</button>

    <p id="paymentMessage"></p>

  </div>

  <!-- Confirmation Popup -->
  <div
    id="confirmationModal"
    aria-modal="true"
    role="dialog"
    aria-describedby="modalDesc"
  >
    <div id="modalContent">

      <p id="modalDesc">
        Are you sure you want to proceed with the payment?
      </p>

      <button class="confirm" id="confirmPayment">
        Yes, Pay
      </button>

      <button class="cancel" id="cancelPayment">
        Cancel
      </button>

    </div>
  </div>

  <script>
    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    const totalAmount = cart.reduce(
      (sum, item) => sum + Number(item.price || 0),
      0
    );

    const orderTotalElem = document.getElementById("order-total");
    const buyNowBtn = document.getElementById("buyNowBtn");
    const confirmationModal = document.getElementById("confirmationModal");
    const confirmPaymentBtn = document.getElementById("confirmPayment");
    const cancelPaymentBtn = document.getElementById("cancelPayment");
    const paymentMessage = document.getElementById("paymentMessage");

    // Display total amount
    orderTotalElem.textContent =
      totalAmount > 0
        ? "Total amount: ₹" + totalAmount
        : "Your cart is empty. Please add items.";

    if (cart.length === 0 || totalAmount <= 0) {
      buyNowBtn.disabled = true;
    }

    // Initialize Cashfree in sandbox mode
    const cashfree = Cashfree({
      mode: "sandbox"
    });

    // Open confirmation popup
    buyNowBtn.addEventListener("click", () => {
      if (cart.length === 0) return;

      const name = document.getElementById("customerName").value.trim();
      const email = document.getElementById("customerEmail").value.trim();
      const phone = document.getElementById("customerPhone").value.trim();

      if (!name) {
        paymentMessage.textContent = "Please enter your name.";
        return;
      }

      if (email && !document.getElementById("customerEmail").checkValidity()) {
        paymentMessage.textContent = "Please enter a valid email address.";
        return;
      }

      if (!/^[6-9]\d{9}$/.test(phone)) {
        paymentMessage.textContent = "Please enter a valid 10-digit Indian phone number.";
        return;
      }

      paymentMessage.textContent = "";
      confirmationModal.style.display = "flex";
    });

    // Cancel payment
    cancelPaymentBtn.addEventListener("click", () => {
      confirmationModal.style.display = "none";
    });

    // Create Cashfree order and open checkout
    confirmPaymentBtn.addEventListener("click", async () => {
      confirmationModal.style.display = "none";

      const name = document.getElementById("customerName").value.trim();
      const email = document.getElementById("customerEmail").value.trim();
      const phone = document.getElementById("customerPhone").value.trim();

      buyNowBtn.disabled = true;
      buyNowBtn.textContent = "Creating Order...";
      paymentMessage.textContent = "";

      try {
        const response = await fetch("/api/create-order", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            items: cart.map(item => ({
              id: Number(item.id)
            })),
            customer: {
              name: name,
              email: email,
              phone: phone
            }
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Unable to create payment order.");
        }

        if (!data.paymentSessionId) {
          throw new Error("Cashfree did not return a payment session.");
        }

        buyNowBtn.textContent = "Opening Payment...";

        await cashfree.checkout({
          paymentSessionId: data.paymentSessionId,
          redirectTarget: "_self"
        });

      } catch (error) {
        console.error("Payment error:", error);

        paymentMessage.textContent =
          error.message || "Something went wrong. Please try again.";

        buyNowBtn.disabled = false;
        buyNowBtn.textContent = "Buy Now";
      }
    });
  </script>

</body>
</html>

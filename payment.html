<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout | BookNest</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
      margin: 0; padding: 0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255,255,255,0.28);
      padding: 38px 40px;
      border-radius: 22px;
      box-shadow: 0 12px 44px 0 rgba(31,38,135,0.19);
      backdrop-filter: blur(7px);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h2 {
      margin-bottom: 30px;
      color: #130cb7;
      font-weight: 700;
      font-size: 2.1rem;
      letter-spacing: 1px;
    }
    #order-total {
      font-size: 1.3rem;
      margin-bottom: 28px;
      font-weight: 600;
      color: #24386d;
    }
    #buyNowBtn {
      display: block;
      background: linear-gradient(90deg, #52e5e7, #130cb7);
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 1.15rem;
      border-radius: 12px;
      cursor: pointer;
      margin: 18px auto 0 auto;
      font-weight: 600;
      box-shadow: 0 4px 18px rgba(16,38,135,0.18);
      transition: background 0.3s, transform 0.2s;
    }
    #buyNowBtn:disabled {
      background: #c1c4cb;
      cursor: not-allowed;
      color: #888;
      box-shadow: none;
    }
    #buyNowBtn:hover:enabled {
      background: linear-gradient(90deg, #130cb7, #52e5e7);
      transform: scale(1.06);
    }
    #confirmationModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.35);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #modalContent {
      background: rgba(255,255,255,0.98);
      padding: 32px 26px;
      border-radius: 14px;
      max-width: 330px;
      width: 88%;
      text-align: center;
      box-shadow: 0 4px 22px rgba(30,38,135,0.17);
    }
    #modalDesc {
      margin-bottom: 24px;
      font-size: 1.09rem;
      color: #333;
    }
    #modalContent button {
      margin: 0 12px;
      width: 110px;
      padding: 11px 0;
      font-size: 1rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(52,58,135,0.11);
      transition: background 0.2s, color 0.2s;
    }
    #modalContent button.confirm {
      background: linear-gradient(90deg, #28a745, #43e97b);
      color: #fff;
    }
    #modalContent button.confirm:hover {
      background: #1e7e34;
    }
    #modalContent button.cancel {
      background: linear-gradient(90deg, #fa5252, #ffadad);
      color: #fff;
    }
    #modalContent button.cancel:hover {
      background: #a71d2a;
    }
    @media (max-width: 600px) {
      .container { padding: 13px; border-radius: 14px; }
      h2 { font-size: 1.30rem; }
      #modalContent { padding: 14px 6px; }
      #buyNowBtn { padding: 11px 14px; font-size: 0.99rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Checkout</h2>
    <p id="order-total">Loading total...</p>
    <button id="buyNowBtn">Buy Now</button>
  </div>
  <!-- Confirmation popup modal -->
  <div id="confirmationModal" aria-modal="true" role="dialog" aria-labelledby="modalTitle" aria-describedby="modalDesc">
    <div id="modalContent">
      <p id="modalDesc">Are you sure you want to proceed with the payment?</p>
      <button class="confirm" id="confirmPayment">Yes, Pay</button>
      <button class="cancel" id="cancelPayment">Cancel</button>
    </div>
  </div>
  <script>
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const totalAmount = cart.reduce((sum, item) => sum + item.price, 0);
    const orderTotalElem = document.getElementById('order-total');
    const buyNowBtn = document.getElementById('buyNowBtn');
    const confirmationModal = document.getElementById('confirmationModal');
    const confirmPaymentBtn = document.getElementById('confirmPayment');
    const cancelPaymentBtn = document.getElementById('cancelPayment');
    orderTotalElem.textContent =
      totalAmount > 0 ? "Total amount: ₹" + totalAmount : "Your cart is empty. Please add items.";
    if (totalAmount === 0) {
      buyNowBtn.disabled = true;
    }
    buyNowBtn.addEventListener('click', () => {
      if (totalAmount === 0) return;
      confirmationModal.style.display = "flex";
    });
    cancelPaymentBtn.addEventListener('click', () => {
      confirmationModal.style.display = "none";
    });
    confirmPaymentBtn.addEventListener('click', () => {
      confirmationModal.style.display = "none";
      const options = {
        key: "rzp_live_ReUOwUBLd4UQu9", // <-- Replace with your Razorpay Test Key if testing
        amount: totalAmount * 100,
        currency: "INR",
        name: "BookNest",
        description: "Purchase of Books",
        image: "logo.jpg",
        handler: function (response){
          alert(`Payment Successful!\nPayment ID: ${response.razorpay_payment_id}`);
          localStorage.setItem('purchasedBooks', JSON.stringify(cart));
          localStorage.removeItem('cart');
          window.location.href = "thankyou.html";
        },
        prefill: {
          name: "",
          email: ""
        },
        notes: {
          address: localStorage.getItem('address') || ''
        },
        theme: {
          color: "#2a52be"
        }
      };
      const rzp = new Razorpay(options);
      rzp.open();
      rzp.on('payment.failed', function (response){
        alert("Payment failed. Reason: " + response.error.description);
      });
    });
  </script>
</body>
</html>

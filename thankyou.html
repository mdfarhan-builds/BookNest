<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | BookNest</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .message {
      background: white;
      padding: 40px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #28a745;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 1.1rem;
      line-height: 1.5;
    }

    .download-link {
      display: inline-block;
      margin: 10px 5px 0;
      background-color: #2a52be;
      color: white;
      padding: 12px 25px;
      font-size: 1rem;
      border-radius: 8px;
      text-decoration: none;
    }

    .download-link:hover {
      background-color: #2048a3;
    }

    .home-link {
      display: block;
      margin-top: 20px;
      color: #2a52be;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="message">
    <h1 id="heading">Thank you for your purchase!</h1>

    <p id="message">
      Your payment was successful. Your books are ready to download.
    </p>

    <p id="orderDetails"></p>

    <div id="downloadButtons"></div>

    <a href="index.html" class="home-link">Go back to Home</a>
  </div>

  <script>
    const verifiedOrderId = localStorage.getItem("verifiedOrderId");
    const verifiedAmount = localStorage.getItem("verifiedOrderAmount");

    const purchasedBooks =
      JSON.parse(localStorage.getItem("purchasedBooks") || "[]");

    const heading = document.getElementById("heading");
    const message = document.getElementById("message");
    const container = document.getElementById("downloadButtons");
    const orderDetails = document.getElementById("orderDetails");

    // Do not show downloads without a verified Cashfree order.
    if (!verifiedOrderId) {
      heading.textContent = "Payment not verified";
      message.textContent =
        "We could not confirm your payment. Please contact BookNest support.";
      container.innerHTML = "";
    } else {
      orderDetails.textContent =
        "Order ID: " + verifiedOrderId +
        (verifiedAmount ? " | Amount: ₹" + verifiedAmount : "");

      if (purchasedBooks.length > 0) {
        purchasedBooks.forEach(book => {
          const fileName =
            book.title.toLowerCase().replace(/\s+/g, "") + ".pdf";

          const link = document.createElement("a");

          link.href = "pdfs/" + encodeURIComponent(fileName);
          link.download = fileName;
          link.className = "download-link";
          link.textContent = "Download " + book.title;

          container.appendChild(link);
        });
      } else {
        message.textContent =
          "Your payment was verified, but we couldn't find your purchased book details. Please contact BookNest support.";
      }
    }
  </script>

</body>
</html>
